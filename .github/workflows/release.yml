name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  # Runs repo scripts (tests, build) with no publish credentials.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - run: npm ci --ignore-scripts

      - name: test and build
        run: npm run typecheck && npm test && npm run build && npm run size

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Installs nothing and runs no repo scripts (package.json has no prepublish hooks).
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: compute SRI
        run: |
          SRI=$(openssl dgst -sha384 -binary dist/maya.global.js | openssl base64 -A)
          echo "## Release SRI" >> $GITHUB_STEP_SUMMARY
          echo "dist/maya.global.js sha384-$SRI" >> $GITHUB_STEP_SUMMARY
