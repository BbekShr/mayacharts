name: Compare

# Re-measures every library in e2e/compare/ref (compare.json), their bundle sizes (compare-size.json)
# and the code it takes to write each chart (compare-ease.json), and commits the three files when
# they changed.
# The LLM eval (eval/run.mjs) calls a paid API and never runs here.
# The measuring job installs npm packages and has read-only access. Only the second job can write,
# and it runs no repository code.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - run: npm ci

      - run: npm run compare
      - run: npm run compare:size --if-present
      - run: npm run compare:ease --if-present

      - uses: actions/upload-artifact@v4
        with:
          name: compare-json
          path: |
            site/compare.json
            site/compare-size.json
            site/compare-ease.json
          if-no-files-found: error

  commit:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: compare-json
          path: measured

      - name: Commit the compare files if they changed
        run: |
          for f in compare compare-size compare-ease; do
            if [ -f "measured/$f.json" ]; then cp "measured/$f.json" "site/$f.json"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/compare*.json
          if git diff --cached --quiet; then
            echo "compare files unchanged"
          else
            git commit -m "Update compare files"
            git push origin HEAD:main
          fi
