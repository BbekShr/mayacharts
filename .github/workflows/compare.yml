name: Compare

# Measures the libraries in e2e/compare/ref (compare.json), their bundle sizes (compare-size.json)
# and the code it takes to write each chart (compare-ease.json), and commits the three files when
# they changed. A release tag re-measures mayaCharts only (COMPARE_LIBS=maya) and keeps the other
# libraries' last numbers: their code is pinned by compare/package-lock.json. Every library is
# re-measured when that lockfile or a reference module changes on main, or by hand with full: true.
# The LLM eval (eval/run.mjs) calls a paid API and never runs here.
# The measuring job installs npm packages and has read-only access. Only the second job can write,
# and it runs no repository code.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - compare/package.json
      - compare/package-lock.json
      - e2e/compare/ref/**
  workflow_dispatch:
    inputs:
      full:
        description: Re-measure every library, not only mayaCharts
        type: boolean
        default: false

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      # The container runs as root but the checkout belongs to the runner user; compare.spec.ts
      # reads the commit with git rev-parse.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: npm ci

      # Tag pushes and default manual runs measure mayaCharts only; a push to main (lockfile or
      # reference change) or full: true measures every library.
      - run: |
          if [ "$FULL" != "true" ]; then export COMPARE_LIBS=maya; fi
          npm run compare
        env:
          FULL: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.full }}
      - run: npm run compare:size --if-present
      - run: npm run compare:ease --if-present

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compare-json
          path: |
            site/compare.json
            site/compare-size.json
            site/compare-ease.json
          if-no-files-found: error

  commit:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compare-json
          path: measured

      - name: Commit the compare files if they changed
        run: |
          for f in compare compare-size compare-ease; do
            if [ -f "measured/$f.json" ]; then cp "measured/$f.json" "site/$f.json"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/compare*.json
          if git diff --cached --quiet; then
            echo "compare files unchanged"
          else
            git commit -m "Update compare files"
            git push origin HEAD:main
          fi
