name: E2E (all browsers)

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]

jobs:
  e2e-full:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    # Same image the Linux screenshot baselines were generated in, so fonts match exactly.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: npm ci

      - run: npm run build

      - run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-${{ matrix.project }}-results
          path: |
            test-results/
            playwright-report/
